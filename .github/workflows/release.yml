name: Release Vaulture

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Vaulture.Photino/ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Vaulture.Photino/ui
        run: npm ci

      - name: Build Standalone Linux & Windows Distributions
        run: |
          chmod +x build-distribution.sh
          ./build-distribution.sh

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Vaulture ${{ steps.release_info.outputs.tag }}
          files: |
            release/Vaulture-linux-x64.tar.gz
            release/Vaulture-win-x64.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
